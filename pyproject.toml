[project]
name = "cartpole-control"
version = "0.1.0"
description = "Trajectory optimization and constrained MPC for an underactuated cart-pole, built on Drake."
requires-python = ">=3.13"
dependencies = [
    "drake==1.56.0",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cartpole"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

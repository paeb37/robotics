[project]
name = "cartpole-control"
version = "0.1.0"
description = "Trajectory optimization and constrained MPC for an underactuated cart-pole, built on Drake."
# Drake's supported Python versions are platform-dependent: 3.12-3.14 on Ubuntu,
# but 3.13-3.14 on macOS (no macOS wheel is published for 3.12). This floor is
# the Ubuntu one, because that is what CI and the Docker image run. On macOS,
# pip will refuse to resolve the Drake wheel on 3.12 anyway.
requires-python = ">=3.12"
dependencies = [
    "drake==1.56.0",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    # Figures only. Deliberately a dev extra: the runtime image never plots, so
    # it should not carry matplotlib.
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cartpole"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow tests re-solve the swing-up trajectory (minutes). Deselected by default;
# run them with `pytest -m slow`. Everything else must stay fast enough that
# there is no excuse not to run it.
markers = ["slow: re-solves the trajectory optimisation (minutes)"]
addopts = "-m 'not slow' -q"
